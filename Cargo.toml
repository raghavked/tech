[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
license = "UNLICENSED"
repository = "https://github.com/raghavked/tech"

[workspace.dependencies]
basis-core = { path = "crates/basis-core" }
basis-connectors = { path = "crates/basis-connectors" }
basis-model = { path = "crates/basis-model" }
basis-trade = { path = "crates/basis-trade" }

serde = { version = "1", features = ["derive"] }
serde_json = "1"
csv = "1.3"
toml = "0.9"
time = { version = "0.3", features = ["serde", "formatting", "parsing", "macros", "serde-well-known"] }
rust_decimal = { version = "1.36", features = ["serde", "serde-with-str"] }
thiserror = "2"
anyhow = "1"
clap = { version = "4.5", features = ["derive", "env"] }
sha2 = "0.10"
hex = "0.4"
log = "0.4"
env_logger = "0.11"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls-native-roots"] }
tempfile = "3"
assert_cmd = "2"

[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
opt-level = 1

[profile.release]
lto = "thin"
codegen-units = 4
