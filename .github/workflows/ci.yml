name: ci

on:
  push:
    branches: ["**"]
  pull_request:

env:
  HENOSIS_OFFLINE: "1"

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - run: pnpm e2e
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-store
          path: |
            store-e2e/demo.out
            store-e2e/report.md
            store-e2e/demo/sessions/demo/*.md
          if-no-files-found: ignore

  browser:
    runs-on: ubuntu-latest
    needs: [check]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm web:smoke
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: apps/web/test-results/
          if-no-files-found: ignore

  # The hosted deployment is wired front to back (docs/20_hosting.md, "Proving the deployment"):
  # the function, the rewrites, the websocket upgrade and the app shell, from GitHub's runners.
  live:
    runs-on: ubuntu-latest
    needs: [browser]
    env:
      HENOSIS_LIVE_URL: https://henosis-raghav14.vercel.app
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: node scripts/live-check.mjs
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm --filter @henosis/web run smoke:live
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-live-report
          path: apps/web/test-results/
          if-no-files-found: ignore
