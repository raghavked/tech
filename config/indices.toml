# Settlement index specifications. Reference specs describe what each observation is
# adjusted TO before aggregation. Methodology parameters are founder-supplied priors:
# re-estimate against published prints once index history is available.

[[index]]
id = "sdh100rt"                 # Silicon Data H100 Rental Index style (CME)
gpu = "h100"
exchange = "cme"
reference = { interconnect = "sxm", term = "on_demand", region = "us_east" }
tiers = ["hyperscaler", "neo_cloud", "marketplace", "colo", "private"]
listing_kinds = ["list", "transaction"]
tier_weight_cap = { hyperscaler = 0.10 }
provider_cap = 0.15
mad_k = 3.0
winsor = [0.05, 0.95]
settlement = "final_day"        # TO VERIFY against the CME contract specification
calibration_days = 60

