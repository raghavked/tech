/* ==========================================================================================

   Self-contained. Token values from design/henosis/tokens.css and SYSTEM §2/§16: light in :root,
   dark twice (the system media query and [data-theme="dark"]). No external assets; nothing fetched.
   Fraunces and Inter asked first, then the Instrument faces, then the system's own.
   The stage is the page itself (cream by day, the dark canvas by night), so the mark recolours by
   ground (SYSTEM §1.5, §5): person = chocolate on cream, the hand-as-text #CAA49B at night; agent =
   navy on cream, apricot at night. The judges' chocolate-on-navy 1.7 : 1 hero arc is gone by
   construction, and light and dark are two stills, not one.
   Every animation sits under the one guard (MOTION §3); the clocks go to zero under Calm and reduce;
   rest states are written outside it. The sky is drawn by the constellation's ring drawer
   (sig-presence-constellation, the --cst-* properties): one drawer, two callers.
   ========================================================================================== */
:root {
  --fondant: #56352D; --apricot: #E2C4A6; --blues: #2A3244; --cream: #FBF7F1; --night: #0B0E14;
  --canvas: #FBF7F1; --wash: rgba(226,196,166,.35);
  --surface: #FFFFFF; --surface-2: #F4EEE5; --surface-3: #ECE3D6;

  --apricot-deep: #CFA782; --apricot-soft: rgba(226,196,166,.30); --select-wash: rgba(226,196,166,.16); --select-line: rgba(207,167,130,.5);
  --ok: #4F7D4A; --ok-soft: rgba(79,125,74,.14); --ok-ink: #3E6639; --warn: #B9792E; --warn-ink: #7F5320; --info: #5B6273;

  --shadow-soft: 0 10px 30px rgba(42,50,68,.08); --shadow-pop: 0 18px 50px rgba(42,50,68,.16);
  --focus-ring: #56352D; --focus-halo: rgba(226,196,166,.45);
  --mark-disc: #2A3244; --mark-arc-a: #56352D; --mark-arc-b: #E2C4A6; --mark-dot: #E2C4A6; /* brand constants, never --accent */
  /* the sky: the constellation's drawer, colour only through these (sig-presence-constellation) */
  --cst-person: #56352D; --cst-person-a: .86; --cst-agent: #2A3244; --cst-agent-a: .74;
  --cst-bright: #56352D; --cst-baton: #CFA782; --cst-centre: #CFA782;
  --cst-guide: rgba(42,50,68,.34); --cst-thread: rgba(86,53,45,.55); --cst-halo: rgba(226,196,166,.85); --cst-aura: rgba(226,196,166,.7);
  --cst-w: 1.6; --cst-w-baton: 2.6; --cst-w-hero: 5.5;
  --cst-planning: #CFA782;
  --font: Inter, "Instrument Sans", -apple-system, "Segoe UI", system-ui, sans-serif;
  --serif: Fraunces, "Instrument Serif", "Iowan Old Style", "Palatino Linotype", Georgia, serif;
  --mono: "JetBrains Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  --radius-sm: 6px; --radius: 14px; --radius-lg: 22px; --radius-full: 999px;
  --rail-w: 296px; --words-w: 404px; --gutter: 72px;
  /* the system's three clocks and curves (MOTION §2), plus the four this element adds */

  --t-draw: 450ms; --t-cam: 900ms; --t-stagger: 120ms; --t-frame: 560ms; --t-ghost: 800ms; --k: 1;

  color-scheme: light;

  --ok: #9BC88F; --ok-soft: rgba(155,200,143,.18); --ok-ink: #9BC88F; --warn: #E2B06A; --warn-ink: #E2B06A; --info: #B4BAC6;

  --count-bg: #E2C4A6; --count-fg: #2A3244; --pill-team-bg: rgba(226,196,166,.18); --pill-team-fg: #E2C4A6; --agent-bg: #3A4458;

/* ---------- the one guard's other half: clocks to zero under Calm and reduce (MOTION §3) ---------- */
:root[data-motion="calm"] { --t-fast: 0ms; --t: 0ms; --t-slow: 0ms; --t-draw: 0ms; --t-cam: 0ms; --t-stagger: 0ms; --t-frame: 0ms; --t-ghost: 0ms; --k: 0; }
@media (prefers-reduced-motion: reduce) { :root { --t-fast: 0ms; --t: 0ms; --t-slow: 0ms; --t-draw: 0ms; --t-cam: 0ms; --t-stagger: 0ms; --t-frame: 0ms; --t-ghost: 0ms; --k: 0; } }
/* first paint lands finished (MOTION §4.4): .boot zeroes the clocks for two frames so a deep-linked beat is its rest state */
:root.boot { --t-fast: 0ms; --t: 0ms; --t-slow: 0ms; --t-draw: 0ms; --t-cam: 0ms; --t-stagger: 0ms; --t-frame: 0ms; --t-ghost: 0ms; --k: 0; }
:root.boot * { animation: none !important; }

/* ---------- base ---------- */
* { box-sizing: border-box; }
html, body { height: 100%; }
body { margin: 0; background: var(--canvas); color: var(--ink); font: 400 15px/24px var(--font); -webkit-font-smoothing: antialiased; font-optical-sizing: auto; overflow: hidden; }
h1, h2, h3, p, figure { margin: 0; }
button { font: inherit; color: inherit; }
a { color: inherit; text-decoration: none; }
.rail a:hover { background: var(--rail-2); }
:focus-visible { outline: 2px solid var(--focus-ring); outline-offset: 2px; box-shadow: 0 0 0 6px var(--focus-halo); border-radius: 6px; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.serif { font-family: var(--serif); font-weight: 400; font-variation-settings: "SOFT" 50, "WONK" 0; letter-spacing: -0.01em; }
.mono { font-family: var(--mono); font-variant-numeric: tabular-nums slashed-zero; }
i, .i { font-style: italic; }
code { font-family: var(--mono); font-size: .9em; font-variant-numeric: tabular-nums; background: var(--surface-2); padding: 1px 6px; border-radius: 6px; }

/* ---------- the mark, inlined so .arc and .dot rules reach it (MOTION §4.3) ---------- */
.mark { display: inline-block; vertical-align: middle; flex: none; overflow: visible; }
.mark .disc { fill: var(--mark-disc); }
.mark .arc { fill: none; stroke-width: 10; stroke-linecap: round; }
.mark .arc.a { stroke: var(--mark-arc-a); } .mark .arc.b { stroke: var(--mark-arc-b); } .mark .dot { fill: var(--mark-dot); }
.mark.small .arc { stroke-width: 13; }
.mark .arc, .mark .dot { transform-origin: 48px 48px; transform-box: view-box; }
.rail .mark .arc.a { stroke: #AD8E78; } /* the rail's 62 % lift at 24 px (SYSTEM §5) */

/* ==========================================================================================
   THE STAGE
   ========================================================================================== */
.stage { position: relative; width: 100%; height: 100%; overflow: clip; background: var(--canvas); isolation: isolate; }
body > .stage { position: fixed; inset: 0; }
.stage::before { content: none; }
/* the one wash, painted as a blurred disc that follows the camera (SYSTEM §2.2's technique): "apricot as light", three-colour-brands §5 */
.lamp { position: absolute; left: 0; top: 0; width: 560px; height: 560px; margin: -280px 0 0 -280px; border-radius: 50%; pointer-events: none;
  background: radial-gradient(closest-side, var(--wash), transparent 72%); transform: translate(var(--lx, 50%), var(--ly, 50%)) scale(var(--ls, 1)); opacity: var(--lo, 1);
  transition: transform var(--t-cam) var(--ease-mark), opacity var(--t-cam) var(--ease-move); will-change: transform; z-index: 0; }

/* ---------- the sky (the constellation's drawing) ---------- */
.sky { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; font-family: var(--serif); z-index: 1; transition: opacity var(--t-frame) var(--ease-move); }
.sky .cam { transform: var(--cam, none); transition: transform var(--t-cam) var(--ease-mark); will-change: transform; }
.sky text { fill: var(--ink); font-size: 16px; paint-order: stroke; stroke: var(--canvas); stroke-width: 4px; stroke-linejoin: round; font-variant-numeric: lining-nums; font-variation-settings: "SOFT" 50, "WONK" 0; }
.sky text.state { font-family: var(--font); font-size: 12px; fill: var(--ink-2); letter-spacing: .005em; }
.sky text.sname { font-style: italic; font-size: 15px; fill: var(--ink-2); }
.sky text.crew { font-style: italic; font-size: 13.5px; fill: var(--accent-ink); letter-spacing: .04em; stroke-width: 3px; }
.sky .arc { fill: none; stroke-linecap: round; stroke-width: var(--cst-w); stroke-dasharray: 1 1.1; stroke-dashoffset: 0; transform-box: view-box;
  transition: stroke-dashoffset var(--t-draw) var(--ease-move), stroke-width var(--t-cam) var(--ease-mark), opacity var(--t-slow) var(--ease-move), transform var(--t-cam) var(--ease-arrive); }
.sky .arc.person { stroke: var(--cst-person); stroke-opacity: var(--cst-person-a); }
.sky .arc.agent { stroke: var(--cst-agent); stroke-opacity: var(--cst-agent-a); }
.sky .arc.baton { stroke-width: var(--cst-w-baton); stroke-opacity: 1; }
.sky .aura { fill: none; stroke: var(--cst-aura); stroke-width: 14; stroke-linecap: round; opacity: 0; transition: opacity var(--t-slow) var(--ease-move); }
.sky .guide { fill: none; stroke: var(--cst-guide); stroke-width: 1.3; stroke-linecap: round; stroke-dasharray: .5 4.2; transition: opacity var(--t-slow) var(--ease-move); }
.sky .centre { fill: var(--cst-centre); transform-box: fill-box; transform-origin: center; transition: transform var(--t-slow) var(--ease-arrive); }
.sky .ghost { fill: none; stroke: var(--cst-guide); stroke-width: 1.25; stroke-dasharray: 1.5 2.5; transition: opacity var(--t-slow) var(--ease-move); }
.sky .thread { fill: none; stroke: var(--cst-thread); stroke-width: 1.3; stroke-linecap: round; stroke-dasharray: .5 4.6; }
.sky .pt .dot { fill: var(--cst-person); fill-opacity: var(--cst-person-a); }
.sky .pt.baton .dot { fill: var(--cst-bright); fill-opacity: 1; }
.sky .ring-baton { fill: none; stroke: var(--cst-baton); stroke-width: 2; }
.sky .halo { fill: var(--cst-halo); opacity: 0; transform-box: fill-box; transform-origin: center; }
.sky .pt.agent .sq { fill: var(--cst-agent); }
.sky .pr { stroke: var(--canvas); stroke-width: 2; }
.sky .pr.running { fill: var(--ok); } .sky .pr.awaiting { fill: var(--warn); } .sky .pr.paused { fill: var(--info); } .sky .pr.planning { fill: var(--cst-planning); }
.sky .pt, .sky .lbl, .sky .sname, .sky .threadg, .sky .ring { transition: opacity var(--t-slow) var(--ease-move); }
.sky .pt, .sky .lbl { transition-delay: calc(var(--d, 0ms) * var(--k)); }
.sky .ripple { fill: none; stroke: var(--cst-halo); stroke-width: 2; opacity: 0; transform-box: fill-box; transform-origin: center; }

/* ---------- per-beat rest states for the sky (every state is CSS keyed on data-frame) ---------- */
/* beats 1–2: only the hero ring exists; its arcs are the mark at hero width */
.stage[data-frame="1"] .ring:not(.hero), .stage[data-frame="2"] .ring:not(.hero), .stage[data-frame="1"] .threadg, .stage[data-frame="2"] .threadg { opacity: 0; }
.stage[data-frame="1"] .ring:not(.hero) .arc, .stage[data-frame="2"] .ring:not(.hero) .arc { stroke-dashoffset: 1.03; }
.stage[data-frame="1"] .hero .arc, .stage[data-frame="2"] .hero .arc { stroke-width: var(--cst-w-hero); stroke-opacity: 1; }
.stage[data-frame="1"] .hero .arc.person { transform: rotate(60deg); }
.stage[data-frame="1"] .hero .arc.agent { transform: rotate(-60deg); opacity: 0; }
.stage[data-frame="1"] .hero .pt, .stage[data-frame="1"] .hero .lbl { opacity: 0; }
.stage[data-frame="1"] .hero .ghost, .stage[data-frame="2"] .hero .ghost { transition-delay: var(--t-ghost); }
.stage[data-frame="1"] .hero .ghost { opacity: 0; transition-delay: 0ms; }
.stage[data-frame="1"] .hero .sname, .stage[data-frame="2"] .hero .sname { opacity: 0; }
.stage[data-frame="1"] .hero .guide { opacity: 1; }
.stage:not([data-frame="1"]) .hero .guide { opacity: 0; }
.stage[data-frame="1"] .hero .pt .dot, .stage[data-frame="2"] .hero .pt .dot { r: 7; }
.stage[data-frame="1"] .hero .pt .sq, .stage[data-frame="2"] .hero .pt .sq { transform: scale(1.35); }
.sky .pt .sq, .sky .pt .dot { transform-box: fill-box; transform-origin: center; transition: transform var(--t-cam) var(--ease-mark), r var(--t-cam) var(--ease-mark); }
.stage[data-frame="1"] .hero .pt .pr, .stage[data-frame="2"] .hero .pt .pr { opacity: 0; }
/* centres are present from beat 3 (every whole ring); the hero keeps a ghost until she enters */
.stage[data-frame="1"] .centre, .stage[data-frame="2"] .centre { transform: scale(0); }
.hero .centre { transform: scale(0); } .hero .ghost { opacity: 1; }
.stage[data-frame="6"] .hero .centre { transform: scale(1); } .stage[data-frame="6"] .hero .ghost { opacity: 0; }
/* beat 4: the sky dims except the hero; the agent's arc wears its aura */
.stage[data-frame="4"] .ring:not(.hero), .stage[data-frame="4"] .threadg { opacity: .26; }
.stage[data-frame="4"] .hero .aura { opacity: 1; }
/* beat 5: lean in; the others fall to a hint and lose their names */
.stage[data-frame="5"] .ring:not(.hero), .stage[data-frame="5"] .threadg { opacity: .14; }
.stage[data-frame="5"] .lbl, .stage[data-frame="5"] .sname { opacity: 0; }
/* beat 6: the sky goes as the page comes */
.stage[data-frame="6"] .sky { opacity: 0; }
.stage[data-frame="6"] .lamp { --lo: 0; }

/* ---------- the column of words ---------- */
.words { position: absolute; left: var(--gutter); top: 0; bottom: 0; width: var(--words-w); z-index: 2; display: flex; align-items: center; pointer-events: none; }
.words .beat { position: absolute; left: 0; right: 0; opacity: 0; transform: translateY(8px); transition: opacity var(--t-slow) var(--ease-move), transform var(--t-slow) var(--ease-arrive); pointer-events: none; }
.stage[data-frame="1"] .beat[data-b="1"], .stage[data-frame="2"] .beat[data-b="2"], .stage[data-frame="3"] .beat[data-b="3"],
.stage[data-frame="4"] .beat[data-b="4"], .stage[data-frame="5"] .beat[data-b="5"] { opacity: 1; transform: none; pointer-events: auto; transition-delay: var(--t-slow); }
.kicker { font: 600 11.5px/16px var(--font); letter-spacing: .08em; text-transform: uppercase; color: var(--ink-2); display: flex; align-items: center; gap: 10px; }
.kicker .mono { font-weight: 500; letter-spacing: 0; text-transform: none; font-size: 12px; color: var(--ink-3); }
.say { font-family: var(--serif); font-weight: 400; font-size: 46px; line-height: 50px; letter-spacing: -0.015em; text-wrap: balance; margin-top: 14px; font-variation-settings: "opsz" 40, "SOFT" 50, "WONK" 0; }
.say i { color: var(--accent-ink); }
.beat p.text { font-size: 15.5px; line-height: 24px; color: var(--ink-2); margin-top: 14px; max-width: 100%; text-wrap: pretty; }
.beat p.text + p.text { margin-top: 8px; }
.beat .text .who, .beat .text i { font-family: var(--serif); font-style: italic; font-size: 1.08em; color: var(--ink); }
.beat .text b { font-weight: 500; color: var(--ink); }
.beat .text .mono { font-size: 13.5px; color: var(--ink); }
/* beat 4: the ledger column (ai-interfaces-avoid §1): author mark in the gutter, no bubble */
.ledger { display: grid; grid-template-columns: 44px minmax(0, 1fr); gap: 0 14px; margin-top: 18px; }
.ledger .gut { display: flex; flex-direction: column; align-items: center; padding-top: 2px; }
.ledger .head { display: flex; align-items: baseline; gap: 10px; }
.ledger .head .who { font-family: var(--serif); font-size: 20px; line-height: 24px; }
.ledger .head .status { font-size: 13px; color: var(--ink-2); display: inline-flex; align-items: center; gap: 6px; }
.ledger .head .status::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: var(--apricot-deep); box-shadow: 0 0 0 3px var(--apricot-soft); }
.ledger .lines { display: flex; flex-direction: column; gap: 10px; margin-top: 8px; }
.ledger .lines p { font-size: 15.5px; line-height: 24px; max-width: 40ch; text-wrap: pretty; opacity: 0; transform: translateY(6px); transition: opacity var(--t-slow) var(--ease-move), transform var(--t-slow) var(--ease-arrive); transition-delay: calc(var(--t-slow) + var(--i, 0) * var(--t-stagger)); }
.stage[data-frame="4"] .ledger .lines p { opacity: 1; transform: none; }
.ledger .lines p i { font-family: var(--serif); color: var(--accent-ink); }
.ledger .byline { margin-top: 12px; font: 400 12.5px/16px var(--mono); color: var(--ink-3); font-variant-numeric: tabular-nums; }
.ledger .byline .who { font-family: var(--serif); font-size: 14px; color: var(--ink-2); }
.stage[data-agent="fresh"] [data-read], .stage:not([data-agent="fresh"]) [data-fresh] { display: none; }
/* beat 5: the one card (surface + hairline + soft shadow; the hand is chocolate because the ground is the page) */

.card .row { display: grid; grid-template-columns: 76px minmax(0, 1fr); gap: 12px; align-items: start; padding-top: 10px; border-top: 1px solid var(--line); font-size: 14px; }
.card .row .k { font: 600 11.5px/20px var(--font); letter-spacing: .08em; text-transform: uppercase; color: var(--ink-3); padding-top: 1px; }

.card .budget { height: 4px; border-radius: 2px; background: var(--surface-3); margin-top: 6px; position: relative; overflow: hidden; }
.card .budget i { position: absolute; left: 0; top: 0; bottom: 0; width: 10.5%; background: var(--apricot-deep); border-radius: 2px; }
.card .actions { display: flex; align-items: center; gap: 14px; padding-top: 4px; }
.card .cap { font-size: 13px; color: var(--ink-2); line-height: 18px; }
.card .cap i { font-family: var(--serif); color: var(--ink); font-size: 14px; }
.card .alt { font-size: 13px; color: var(--ink-2); }
.card .alt a { color: var(--accent-ink); text-decoration: none; } .card .alt a:hover { text-decoration: underline; }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; min-height: 36px; padding: 0 16px; border-radius: var(--radius-full); border: 1px solid var(--line); background: var(--surface); color: var(--ink); font: 500 14px/20px var(--font); cursor: pointer; white-space: nowrap; transition: background var(--t-fast) var(--ease-move), box-shadow var(--t-fast) var(--ease-move), transform var(--t) var(--ease-move); }
.btn:hover { box-shadow: var(--shadow-soft); } .btn:active { transform: translateY(1px) scale(.99); }

.btn.primary:hover { background: var(--accent-hover); }

.btn .kbd { font: 500 11px/16px var(--mono); padding: 0 5px; border-radius: 5px; background: var(--surface); border: 1px solid var(--line); color: var(--ink-3); }

/* avatars (SYSTEM §12, with the constellation's fix: the initial's colour comes from the fill, never the theme) */
.avatar { width: 28px; height: 28px; border-radius: 50%; display: inline-grid; place-items: center; font: 500 11px/1 var(--font); flex: none; position: relative; border: 2px solid var(--canvas); background: var(--surface-3); color: var(--ink); }
.avatar.t1 { background: #E6D3C2; color: #2A3244; } .avatar.t2 { background: #CFD6E3; color: #2A3244; } .avatar.t3 { background: #DCD2C0; color: #2A3244; } .avatar.t4 { background: #E2C4A6; color: #2A3244; }
.avatar.serif { font-family: var(--serif); font-size: 13px; }
.avatar.agent { border-radius: 9px 9px 9px 3px; background: var(--agent-bg); }
.avatar.agent::after { content: ""; width: 6px; height: 6px; border-radius: 50%; background: var(--apricot); }
.avatar.sm { width: 22px; height: 22px; } .avatar.sm.agent { border-radius: 7px 7px 7px 2px; } .avatar.sm.agent::after { width: 5px; height: 5px; }
.avatar.driver { box-shadow: 0 0 0 2px var(--apricot-deep); }
.avatar .pr { position: absolute; right: -2px; bottom: -2px; width: 9px; height: 9px; border-radius: 50%; border: 2px solid var(--canvas); background: var(--ok); }
.avatar .pr.planning { background: var(--apricot-deep); }
.stack { display: inline-flex; } .stack .avatar + .avatar { margin-left: -8px; }
.ledger .gut .avatar { width: 40px; height: 40px; border-radius: 12px 12px 12px 4px; border: 0; }
.ledger .gut .avatar::after { width: 8px; height: 8px; }

/* ==========================================================================================
   BEAT 6 · the frame arrives around the page
   ========================================================================================== */
.app { position: absolute; inset: 0; z-index: 3; display: flex; pointer-events: none; visibility: hidden; transition: visibility 0s var(--t-frame); }
.stage[data-frame="6"] .app { pointer-events: auto; visibility: visible; transition-delay: 0s; }
.rail { width: var(--rail-w); flex: none; background: var(--rail); color: var(--rail-fg); display: flex; flex-direction: column; padding: 14px; gap: 4px; transform: translateX(-100%); transition: transform var(--t-frame) var(--ease-mark); box-shadow: inset -1px 0 0 var(--crease); }
.stage[data-frame="6"] .rail { transform: none; }
.rail .brand { display: flex; align-items: center; gap: 10px; padding: 8px 10px 14px; font-family: var(--serif); font-size: 24px; }
.rail .new { display: flex; align-items: center; justify-content: center; gap: 8px; padding: 11px 14px; border-radius: var(--radius); background: var(--gradient-brand); color: var(--grad-fg); border: 0; font: 500 14px/20px var(--font); cursor: pointer; box-shadow: var(--shadow-soft); }
.rail .section { padding: 16px 10px 6px; font: 600 11.5px/16px var(--font); letter-spacing: .08em; text-transform: uppercase; color: var(--rail-muted); display: flex; align-items: center; gap: 8px; }
.rail .item { display: flex; align-items: center; gap: 10px; padding: 7px 12px; border-radius: var(--radius); color: var(--rail-fg); font: 500 14px/20px var(--font); }
.rail .item .ic { width: 16px; height: 16px; flex: none; fill: none; stroke: var(--rail-muted); stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; }
.rail .item .count { margin-left: auto; min-width: 20px; height: 20px; padding: 0 6px; border-radius: 10px; background: var(--count-bg); color: var(--count-fg); font: 600 12px/20px var(--mono); text-align: center; }
.rail .crew { padding: 10px 12px 2px; font-size: 12px; color: var(--rail-muted); display: flex; align-items: center; gap: 8px; }
.rail .crew::before { content: ""; width: 9px; height: 9px; border-radius: 50%; border: 2px solid var(--apricot); }
.rail .crew .serif { font-size: 15px; color: var(--apricot); }
.rail .agentcard { display: flex; flex-direction: column; gap: 4px; padding: 9px 12px; border-radius: var(--radius); color: var(--rail-fg); }
.rail .agentcard.active { background: var(--rail-active); box-shadow: inset 0 0 0 1px var(--select-line); }
.rail .agentcard .head { display: flex; align-items: center; gap: 9px; font-family: var(--serif); font-size: 15.5px; }
.rail .agentcard .head .d { width: 8px; height: 8px; border-radius: 50%; background: var(--rail-muted); flex: none; }
.rail .agentcard .head .d.running { background: #9BC88F; } .rail .agentcard .head .d.awaiting { background: #E2B06A; } .rail .agentcard .head .d.planning { background: var(--apricot); }
.rail .agentcard .head .pill { margin-left: auto; }
.rail .agentcard .doing { font-size: 13px; line-height: 18px; color: var(--rail-muted); }
.rail .agentcard .doing i { font-family: var(--serif); color: var(--apricot); font-size: 14px; }
.rail .agentcard .foot { display: flex; align-items: center; gap: 8px; font: 500 12px/16px var(--font); color: var(--rail-muted); }
.rail .agentcard .foot .mono { margin-left: auto; font-size: 12px; }
.rail .me { margin-top: auto; display: flex; align-items: center; gap: 10px; padding: 10px 12px; border-radius: var(--radius); font-size: 14px; }
.rail .me .avatar { border-color: var(--rail); }
.rail .me .n { font-family: var(--serif); font-size: 16px; } .rail .me .r { font-size: 12px; color: var(--rail-muted); }
.pill { display: inline-flex; align-items: center; gap: 5px; height: 22px; padding: 0 9px; border-radius: var(--radius-full); font: 600 11.5px/22px var(--font); letter-spacing: .02em; background: var(--surface-3); color: var(--ink-2); white-space: nowrap; }
.pill.team { background: var(--pill-team-bg); color: var(--pill-team-fg); }
.pill.solo { background: transparent; border: 1px solid var(--line); }
.rail .pill.solo { border-color: var(--rail-line); color: var(--rail-muted); }
.pill.planning { background: var(--apricot-soft); color: var(--ink); }
.pill.planning::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: var(--apricot-deep); }
/* the page: rises behind the rail */
.page { flex: 1; min-width: 0; display: flex; flex-direction: column; background: var(--canvas); opacity: 0; transition: opacity var(--t-frame) var(--ease-move); }
.stage[data-frame="6"] .page { opacity: 1; transition-delay: calc(var(--t-frame) * .4); }
.topbar { display: flex; align-items: center; gap: 12px; padding: 12px 20px; min-height: 56px; border-bottom: 1px solid var(--line); }
.topbar .title { font-family: var(--serif); font-size: 20px; display: inline-flex; align-items: center; gap: 12px; }
.topbar .status { font-size: 13px; color: var(--ink-2); display: inline-flex; align-items: center; gap: 6px; }
.topbar .status::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: var(--apricot-deep); }
.topbar .right { margin-left: auto; display: flex; align-items: center; gap: 10px; }
.topbar .chip { display: inline-flex; align-items: center; gap: 6px; height: 28px; padding: 0 11px; border-radius: var(--radius-full); background: var(--surface-2); font: 400 13px/28px var(--mono); color: var(--ink-2); }
.stream { flex: 1; display: flex; flex-direction: column; gap: 22px; width: min(780px, 100%); margin: 0 auto; padding: 22px 24px 0; }
.stream > * { opacity: 0; transform: translateY(6px); transition: opacity var(--t-slow) var(--ease-move), transform var(--t-slow) var(--ease-arrive); transition-delay: calc(var(--t-frame) * .6 + var(--i, 0) * var(--t-stagger) * .3); }
.stage[data-frame="6"] .stream > * { opacity: 1; transform: none; }
.joinline { display: flex; align-items: center; gap: 12px; }
.joinline .t { display: flex; flex-direction: column; gap: 2px; }
.joinline .s1 { font-family: var(--serif); font-size: 18px; line-height: 24px; } .joinline .s1 b { font-weight: 400; color: var(--accent-ink); }
.joinline .s2 { font-size: 12.5px; color: var(--ink-3); font-variant-numeric: tabular-nums; }
.joinline .stack { margin-left: auto; }
.msg { display: grid; grid-template-columns: 44px minmax(0, 1fr); gap: 0 14px; }
.msg .meta { display: flex; align-items: baseline; gap: 8px; font-size: 13px; color: var(--ink-2); }
.msg .meta .who { font-family: var(--serif); font-size: 16px; color: var(--ink); }
.msg .meta .turn { margin-left: auto; font: 400 12.5px/16px var(--mono); color: var(--ink-3); }
.msg .text { font-size: 15.5px; line-height: 24px; max-width: 600px; margin-top: 4px; }
.msg.human .text { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius-lg); padding: 12px 18px; box-shadow: var(--shadow-soft), var(--edge); display: inline-block; }
.msg .plan { display: inline-flex; align-items: center; gap: 10px; margin-top: 10px; padding: 8px 12px; border-radius: var(--radius); background: var(--surface); border: 1px solid var(--line); font-size: 13.5px; box-shadow: var(--edge); }
.msg .plan .k { font-family: var(--serif); font-size: 15px; }
.msg .plan .mono { font-size: 12.5px; color: var(--ink-2); }
.composer-wrap { padding: 14px 24px 22px; }
.composer { width: min(780px, 100%); margin: 0 auto; border-top: 1px solid var(--line); padding: 14px 0 0; display: flex; align-items: center; gap: 12px; color: var(--ink-3); font-size: 15px; }
.composer .hint { flex: 1; } .composer .hint i { font-family: var(--serif); color: var(--ink-2); }
.composer .seg { display: inline-flex; background: var(--surface-2); border-radius: var(--radius-full); padding: 3px; }
.composer .seg span { font: 500 12.5px/20px var(--font); color: var(--ink-2); padding: 2px 12px; border-radius: var(--radius-full); }
.composer .seg span.on { background: var(--surface); color: var(--ink); box-shadow: var(--shadow-soft); }
.composer .send { width: 36px; height: 36px; border-radius: 50%; background: var(--accent); color: var(--accent-fg); border: 0; display: inline-grid; place-items: center; }
.composer .send svg { width: 16px; height: 16px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }

/* ---------- the score at the foot: one hairline, six ticks ---------- */
.score { position: absolute; left: var(--gutter); right: var(--gutter); bottom: 34px; z-index: 4; display: flex; flex-direction: column; gap: 10px; transition: opacity var(--t-frame) var(--ease-move); }
.score .rule { position: relative; height: 1px; background: var(--line); }
.score .fill { position: absolute; left: 0; top: 0; height: 1px; width: var(--p, 0%); background: var(--apricot-deep); }
.score .head { position: absolute; left: var(--p, 0%); top: -3px; width: 7px; height: 7px; margin-left: -3.5px; border-radius: 50%; background: var(--apricot-deep); }
.score .ticks { display: grid; grid-template-columns: repeat(6, 1fr); }
.score .tick { background: transparent; border: 0; padding: 0; text-align: left; cursor: pointer; display: flex; flex-direction: column; gap: 1px; color: var(--ink-3); position: relative; }
.score .tick::before { content: ""; position: absolute; left: 0; top: -14px; width: 1px; height: 7px; background: var(--ink-3); opacity: .6; }
.score .tick .n { font-family: var(--serif); font-size: 14px; line-height: 18px; color: var(--ink-2); }
.score .tick .t { font: 400 12px/16px var(--mono); font-variant-numeric: tabular-nums; }
.score .tick[aria-current="step"] .n { color: var(--ink); } .score .tick[aria-current="step"]::before { background: var(--apricot-deep); opacity: 1; height: 9px; top: -16px; }
.score .tick:hover .n { color: var(--ink); }
.stage[data-frame="6"] .score { opacity: 0; pointer-events: none; }
.skip { position: absolute; right: var(--gutter); top: 28px; z-index: 4; transition: opacity var(--t-slow) var(--ease-move); }
.stage[data-frame="6"] .skip { opacity: 0; pointer-events: none; }
.stage .playing-note { position: absolute; left: var(--gutter); top: 32px; z-index: 4; font: 400 12.5px/16px var(--mono); color: var(--ink-3); display: flex; align-items: center; gap: 10px; }
.stage .playing-note .brandrow { display: inline-flex; align-items: center; gap: 8px; font-family: var(--serif); font-size: 18px; color: var(--ink); }
.stage[data-frame="6"] .playing-note { opacity: 0; }

/* ==========================================================================================
   MOTION · every animation under the one guard; the clocks above are the transitions' only timing
   ========================================================================================== */
@keyframes arc-a-once { 0% { transform: rotate(60deg); opacity: .5 } 70% { transform: rotate(-4deg); opacity: 1 } 100% { transform: rotate(0) } }
@keyframes arc-b-once { 0% { transform: rotate(-60deg); opacity: .5 } 70% { transform: rotate(4deg); opacity: 1 } 100% { transform: rotate(0) } }
@keyframes dot-once   { 0%, 55% { transform: scale(0) } 80% { transform: scale(1.25) } 100% { transform: scale(1) } }
@keyframes pop { 0% { transform: scale(.4); opacity: 0 } 60% { transform: scale(1.15); opacity: 1 } 100% { transform: none; opacity: 1 } }
@keyframes ripple { 0% { box-shadow: 0 0 0 0 var(--apricot); opacity: 1 } 100% { box-shadow: 0 0 0 14px var(--apricot); opacity: 0 } }
@keyframes cst-ripple { 0% { transform: scale(.6); opacity: .9 } 100% { transform: scale(3.2); opacity: 0 } }
@keyframes cst-breathe { 0%, 100% { transform: scale(.55); opacity: 0 } 50% { transform: scale(1); opacity: .55 } }
@keyframes breath-aura { 0%, 100% { opacity: .35 } 50% { opacity: 1 } }
@keyframes dot-live { 0% { box-shadow: 0 0 0 0 var(--dot-halo) } 70% { box-shadow: 0 0 0 5px transparent } 100% { box-shadow: 0 0 0 0 transparent } }
@keyframes card-in { 0% { opacity: 0; transform: translateY(6px) } 100% { opacity: 1; transform: none } }
@media (prefers-reduced-motion: no-preference) {
  :root:not([data-motion="calm"]) .hero.swing .arc.person { animation: arc-a-once .8s var(--ease-arrive) both; }
  :root:not([data-motion="calm"]) .hero.swing .arc.agent { animation: arc-b-once .8s var(--ease-arrive) both; }
  :root:not([data-motion="calm"]) .ring.landing .centre { animation: dot-once 1s var(--ease-arrive) both; animation-delay: calc(var(--d, 0ms) + var(--t-draw)); }
  :root:not([data-motion="calm"]) .stage[data-frame="3"] .pt.baton .halo, :root:not([data-motion="calm"]) .stage[data-frame="4"] .pt.baton .halo { animation: cst-breathe 1.8s var(--ease-move) infinite; }
  :root:not([data-motion="calm"]) .stage[data-frame="4"] .hero .aura { animation: breath-aura 1.8s var(--ease-move) infinite; }
  :root:not([data-motion="calm"]) .mark.settle .arc.a { animation: arc-a-once .8s var(--ease-arrive) both; }
  :root:not([data-motion="calm"]) .mark.settle .arc.b { animation: arc-b-once .8s var(--ease-arrive) both; }
  :root:not([data-motion="calm"]) .mark.settle .dot { animation: dot-once 1s var(--ease-arrive) both; }
  :root:not([data-motion="calm"]) .avatar.joined::after { content: ""; position: absolute; inset: -2px; border-radius: inherit; pointer-events: none; animation: ripple .9s var(--ease-leave) .9s both; }
  :root:not([data-motion="calm"]) .count.popped { animation: pop var(--t-slow) var(--ease-arrive) 1s both; }
  :root:not([data-motion="calm"]) .stage[data-frame="6"] .d.running, :root:not([data-motion="calm"]) .stage[data-frame="6"] .avatar .pr.running { --dot-halo: var(--ok-soft); animation: dot-live 1.8s var(--ease-move) infinite; }
  :root:not([data-motion="calm"]) .stage[data-frame="6"] .topbar .status::before { --dot-halo: var(--apricot-soft); animation: dot-live 1.8s var(--ease-move) infinite; }
}

.rail .phone-bar { display: none; }

/* ==========================================================================================
   PHONE · the words take the top, the sky the bottom; the rail becomes the sentence-titlebar
   ========================================================================================== */
@media (max-width: 480px) {
  :root { --gutter: 20px; --words-w: auto; }
  .words { right: var(--gutter); width: auto; align-items: flex-start; top: 72px; bottom: auto; }
  .say { font-size: 34px; line-height: 38px; }
  .beat p.text { font-size: 16px; }
  .sky text { font-size: 15px; } .sky text.state { display: none; } .sky text.sname { font-size: 13.5px; } .sky text.crew { display: none; }
  .sky .ring:not(.hero) .lbl.agent { display: none; }
  .stage[data-frame="4"] .ring:not(.hero), .stage[data-frame="4"] .threadg, .stage[data-frame="5"] .ring:not(.hero), .stage[data-frame="5"] .threadg, .stage[data-frame="4"] .hero .sname { opacity: 0; }
  .stage .playing-note .ctx { display: none; }
  .ledger { grid-template-columns: 36px minmax(0, 1fr); } .ledger .gut .avatar { width: 34px; height: 34px; }
  .ledger .lines p { font-size: 15px; line-height: 22px; }
  .card { padding: 16px 18px 16px; } .card .title { font-size: 22px; line-height: 28px; }
  .card .row { grid-template-columns: 1fr; gap: 4px; } .card .actions { flex-direction: column; align-items: stretch; gap: 8px; } .card .actions .btn.primary { width: 100%; min-height: 48px; }
  .score { bottom: 20px; } .score .ticks .tick:not([aria-current="step"]) .n, .score .ticks .tick:not([aria-current="step"]) .t { visibility: hidden; }
  .skip { top: 18px; right: var(--gutter); }
  .stage .playing-note { top: 22px; }
  .app { flex-direction: column; }
  .rail { width: 100%; height: 92px; padding: 48px 12px 0; flex-direction: row; align-items: center; gap: 10px; transform: translateY(-100%); box-shadow: inset 0 -1px 0 var(--crease); }
  .rail > :not(.phone-bar) { display: none; }
  .rail .phone-bar { display: flex; align-items: center; gap: 10px; width: 100%; }
  .rail .phone-bar .tt { font-family: var(--serif); font-size: 21px; line-height: 24px; }
  .rail .phone-bar .ss { font-size: 12px; color: var(--rail-muted); } .rail .phone-bar .ss b { color: #9BC88F; font-weight: 500; }
  .rail .phone-bar .menu { width: 40px; height: 40px; border-radius: 12px; display: grid; place-items: center; background: transparent; border: 0; color: var(--rail-fg); }
  .rail .phone-bar .menu svg { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 1.6; stroke-linecap: round; }
  .topbar { display: none; }
  .stream { padding: 18px 16px 0; gap: 18px; }
  .msg { grid-template-columns: 34px minmax(0, 1fr); gap: 0 10px; }
  .joinline .stack { display: none; } .msg .plan { flex-wrap: wrap; gap: 2px 10px; }
  .composer-wrap { padding: 12px 16px 28px; }
}
/* ==========================================================================================
   THE EXPLORATION'S OWN · hidden unless the URL says #inspector or #storyboard; never shot
   ========================================================================================== */
.inspector { position: fixed; left: 12px; bottom: 12px; z-index: 50; display: none; align-items: center; gap: 8px; padding: 8px 10px; border-radius: var(--radius); background: var(--surface); border: 1px solid var(--line); box-shadow: var(--shadow-pop), var(--edge); font-size: 12.5px; }
:root[data-inspector] .inspector { display: flex; }
.inspector .seg { display: inline-flex; background: var(--surface-2); border-radius: var(--radius-full); padding: 3px; gap: 2px; }
.inspector .seg button { border: 0; background: transparent; font: 500 12.5px/20px var(--font); color: var(--ink-2); padding: 2px 9px; border-radius: var(--radius-full); cursor: pointer; }
.inspector .seg button[aria-pressed="true"], .inspector .seg button[aria-current="step"] { background: var(--surface); color: var(--ink); box-shadow: var(--shadow-soft); }
.inspector .btn { min-height: 28px; padding: 0 10px; font-size: 12.5px; }

      <a class="agentcard" href="#billing-page"><div class="head"><span class="d running"></span><span>Billing page</span><span class="pill team">Team</span></div><div class="doing"><i>Running tests</i> · step 3 of 5</div><div class="foot"><span class="stack"><span class="avatar sm t1 driver" style="border-color:var(--rail)">A</span><span class="avatar sm t2" style="border-color:var(--rail)">B</span></span>with Bo<span class="mono">12.4k</span></div></a>

<script>
(() => {
  'use strict';
  const html = document.documentElement;
  html.classList.add('boot');
  const f = n => Math.round(n * 100) / 100;
  const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  const motionOn = () => !(html.dataset.motion === 'calm' || matchMedia('(prefers-reduced-motion: reduce)').matches);

  /* ------------------------------------------------------------------------------------------
     The cast (SYSTEM §17): Billing page is Ana's (with Bo), Checkout Bo's (with Ana), Invoice PDF Cy's,
     Tax lines Dee's. Crew Invoice rollout = Cy's and Dee's agents. Dee is the newcomer: her ring is the hero.
     ------------------------------------------------------------------------------------------ */
  const SESSIONS = [
    { id: 'billing', name: 'Billing page', baton: 'ana', members: [{ id: 'ana', name: 'Ana', kind: 'person' }, { id: 'bo', name: 'Bo', kind: 'person' }, { id: 'ana-agent', name: "Ana's agent", kind: 'agent', state: 'running' }] },
    { id: 'checkout', name: 'Checkout', baton: 'bo', members: [{ id: 'bo', name: 'Bo', kind: 'person' }, { id: 'ana', name: 'Ana', kind: 'person' }, { id: 'bo-agent', name: "Bo's agent", kind: 'agent', state: 'awaiting' }] },
    { id: 'invoice', name: 'Invoice PDF', baton: 'cy', members: [{ id: 'cy', name: 'Cy', kind: 'person' }, { id: 'cy-agent', name: "Cy's agent", kind: 'agent', state: 'running', crew: 'Invoice rollout' }] },
    { id: 'tax', name: 'Tax lines', baton: null, hero: true, members: [{ id: 'dee', name: 'Dee', kind: 'person', me: true }, { id: 'dee-agent', name: "Dee's agent", kind: 'agent', state: 'planning', crew: 'Invoice rollout' }] },
  ];
  const STATE_WORD = { running: 'running', awaiting: 'awaiting approval', paused: 'paused', planning: 'planning' };
  const BEATS = [
    { n: 'Your arc', base: 6, say: 'Dee, this is Payments. Three people and three agents are in. You are the fourth person.' },
    { n: 'The ring', base: 10, say: 'Your agent is already here. The centre lands when you enter.' },
    { n: 'The sky', base: 16, say: 'Who is in, and where. Ana has the baton in Billing page, Bo in Checkout, Cy in Invoice PDF. Tax lines is yours and your agent\'s.' },
    { n: 'Your agent', base: 16, say: 'Your agent introduces itself: it plans first, Bo and Cy hold its gate, it answers as your agent, never as you.' },
    { n: 'The session', base: 14, say: 'Your first session: Tax lines. Enter the circle.' },
    { n: 'You join', base: 8, say: 'Dee joins the circle.' },
  ];

  /* ------------------------------------------------------------------------------------------
     Layout: the constellation's geometry (a vesica for two shared people, d = 1.12 r; the agent in the
     largest free gap or at the foot when crewed; a lone ring in the mark's pose) laid for this stage.
     ------------------------------------------------------------------------------------------ */
  const TAU = Math.PI * 2;
  function layout(W, H) {
    const phone = W <= 480;
    const gapA = phone ? 34 : 114, gapB = phone ? 0 : 98;
    const skyL = phone ? 16 : 604, skyR = phone ? W - 16 : W - 112; // room for the outermost labels beside the words column
    const r = phone ? 40 : Math.max(60, Math.min(84, Math.floor((skyR - skyL - gapA - gapB) / 7.12)));
    const d = 1.12 * r;
    const rings = {};
    if (!phone) {
      const total = 2 * r + d + gapA + 2 * r + gapB + 2 * r;
      const x0 = skyL + Math.max(0, (skyR - skyL - total) / 2); const cy = H * 0.5;
      rings.billing = { cx: x0 + r, cy, pair: 'L' }; rings.checkout = { cx: x0 + r + d, cy, pair: 'R' };
      rings.invoice = { cx: x0 + r + d + r + gapA + r, cy }; rings.tax = { cx: x0 + r + d + r + gapA + 2 * r + gapB + r, cy };
    } else {
      const row = 2 * r + d + gapA + 2 * r; const x0 = (W - row) / 2; const y1 = H * 0.58, y2 = H * 0.775;
      rings.billing = { cx: x0 + r, cy: y1, pair: 'L' }; rings.checkout = { cx: x0 + r + d, cy: y1, pair: 'R' };
      rings.invoice = { cx: x0 + r + d + r + gapA + r, cy: y1 };
      rings.tax = { cx: W / 2, cy: y2 };
    }
    const vesA = Math.acos(d / (2 * r));
    const ang = {
      billing: { ana: -vesA, bo: vesA, 'ana-agent': Math.PI },
      checkout: { ana: Math.PI + vesA, bo: Math.PI - vesA, 'bo-agent': 0 },
      invoice: { cy: -Math.PI / 2, 'cy-agent': Math.PI / 2 },
      tax: { dee: 0, 'dee-agent': Math.PI },
    };
    const anchor = phone ? { x: W / 2, y: H * 0.70 } : { x: (skyL + skyR) / 2, y: H * 0.5 };
    const heroS = phone ? 2.1 : Math.min(2.2, (H * 0.5) / r);
    const cam = (s, p) => `translate(${f(anchor.x - s * p.cx)}px, ${f(anchor.y - s * p.cy)}px) scale(${s})`;
    const lean = phone ? 1.2 : 1.3; const camLean = phone ? `translate(${f(W / 2 - lean * rings.tax.cx)}px, ${f(H * 0.84 - lean * rings.tax.cy)}px) scale(${lean})` : cam(lean, rings.tax);
    const cams = { 1: cam(heroS, rings.tax), 2: cam(heroS, rings.tax), 3: 'none', 4: phone ? camLean : 'none', 5: camLean, 6: camLean };
    const skyC = phone ? { x: W / 2, y: H * 0.70 } : { x: (rings.billing.cx + rings.tax.cx) / 2, y: H * 0.5 };
    const lamps = { 1: { x: anchor.x, y: anchor.y, s: 1.1 }, 2: { x: anchor.x, y: anchor.y, s: 1.3 }, 3: { x: skyC.x, y: skyC.y, s: phone ? 1.2 : 1.9 }, 4: { x: anchor.x, y: anchor.y, s: 1.0 }, 5: { x: anchor.x, y: anchor.y, s: 1.1 }, 6: { x: anchor.x, y: anchor.y, s: 1 } };
    return { W, H, r, phone, rings, ang, cams, lamps, anchor };
  }

  /* ------------------------------------------------------------------------------------------
     The ring drawer (shared with sig-presence-constellation): each member owns the arc centred on
     itself, from the midpoint to the previous member to the midpoint to the next, with a seam.
     ------------------------------------------------------------------------------------------ */
  const P = (cx, cy, r, a) => [cx + r * Math.cos(a), cy + r * Math.sin(a)];
  const arcPath = (cx, cy, r, a0, a1) => { const [x0, y0] = P(cx, cy, r, a0), [x1, y1] = P(cx, cy, r, a1); return `M${f(x0)} ${f(y0)}A${r} ${r} 0 ${a1 - a0 > Math.PI ? 1 : 0} 1 ${f(x1)} ${f(y1)}`; };
  // the agent's shape (SYSTEM §12): the rounded square with the tight bottom-left corner, 14 px
  const agentSq = (x, y, s = 14, R = 4, t = 1.2) => { const h = s / 2; return `M${f(x - h + R)} ${f(y - h)}h${f(s - 2 * R)}a${R} ${R} 0 0 1 ${R} ${R}v${f(s - 2 * R)}a${R} ${R} 0 0 1 -${R} ${R}h-${f(s - R - t)}a${t} ${t} 0 0 1 -${t} -${t}v-${f(s - R - t)}a${R} ${R} 0 0 1 ${R} -${R}z`; };

  function renderSky(lay) {
    const { r, rings, ang } = lay; const seam = 4.5 / r;
    const out = [];
    const agentPos = {}, drawn = new Set(), batonOf = {}, ringsOf = {};
    SESSIONS.forEach(s => { if (s.baton) batonOf[s.baton] = s.name; s.members.forEach(m => { ringsOf[m.id] = (ringsOf[m.id] || 0) + 1; }); });
    SESSIONS.forEach((s, si) => {
      const { cx, cy } = rings[s.id];
      const ms = s.members.map(m => ({ ...m, a: ((ang[s.id][m.id] % TAU) + TAU) % TAU })).sort((p, q) => p.a - q.a);
      const n = ms.length;
      out.push(`<g class="ring${s.hero ? ' hero' : ''}" data-id="${s.id}" style="--d:${si * 120}ms">`);
      out.push(`<circle class="guide" cx="${f(cx)}" cy="${f(cy)}" r="${r}"/>`);
      ms.forEach((m, i) => {
        const prevA = i === 0 ? ms[n - 1].a - TAU : ms[i - 1].a; const nextA = i === n - 1 ? ms[0].a + TAU : ms[i + 1].a;
        const a0 = (prevA + m.a) / 2 + seam, a1 = (m.a + nextA) / 2 - seam;
        const baton = s.baton === m.id;
        if (s.hero && m.kind === 'agent') out.push(`<path class="aura" d="${arcPath(cx, cy, r, a0, a1)}"/>`);
        out.push(`<path class="arc ${m.kind}${baton ? ' baton' : ''}" data-m="${m.id}" pathLength="1" d="${arcPath(cx, cy, r, a0, a1)}" style="transform-origin:${f(cx)}px ${f(cy)}px"/>`);
      });
      if (s.hero) out.push(`<circle class="ghost" cx="${f(cx)}" cy="${f(cy)}" r="4.2"/>`);
      out.push(`<circle class="centre" cx="${f(cx)}" cy="${f(cy)}" r="3.8"/>`);
      ms.forEach((m, i) => {
        if (drawn.has(m.id)) return; drawn.add(m.id);
        const [x, y] = P(cx, cy, r, m.a); const baton = !!batonOf[m.id];
        agentPos[m.id] = { x, y, a: m.a };
        out.push(`<g class="pt ${m.kind}${baton ? ' baton' : ''}" data-m="${m.id}" style="--d:${si * 120 + 180 + i * 40}ms">`);
        if (m.kind === 'person') {
          if (baton) out.push(`<circle class="halo" cx="${f(x)}" cy="${f(y)}" r="16"/><circle class="ring-baton" cx="${f(x)}" cy="${f(y)}" r="10.5"/>`);
          out.push(`<circle class="dot" cx="${f(x)}" cy="${f(y)}" r="${baton ? 6.6 : 5}"/>`);
          if (m.me) out.push(`<circle class="ripple" cx="${f(x)}" cy="${f(y)}" r="8"/>`);
        } else {
          out.push(`<path class="sq" d="${agentSq(x, y)}"/><circle class="pr ${m.state}" cx="${f(x + 6)}" cy="${f(y - 6)}" r="3.2"/>`);
        }
        out.push('</g>');
        // the label: outward from the ring; a crew'd agent at the foot points away from its crew-mate
        let dir = m.a;
        if (m.crew && m.kind === 'agent' && Math.abs(m.a - Math.PI / 2) < .01) dir = Math.PI; // a crew'd agent at the foot: its label goes left, the stitch right
        if (ringsOf[m.id] > 1) dir = lay.phone ? (Math.sin(m.a) < 0 ? -Math.PI / 2 : Math.PI / 2) : (Math.sin(m.a) < 0 ? Math.PI : 0); // a shared point: the normals cancel, so the label goes beside it (above and below on the phone)
        const up = Math.sin(dir) < -.35, down = Math.sin(dir) > .35, horiz = !up && !down;
        const anchorT = horiz ? (Math.cos(dir) > 0 ? 'start' : 'end') : (Math.abs(Math.cos(dir)) > .55 ? (Math.cos(dir) > 0 ? 'start' : 'end') : 'middle');
        const off = ringsOf[m.id] > 1 && !lay.phone ? 26 : (m.kind === 'agent' ? 17 : (baton ? 18 : 14));
        const lx = x + Math.cos(dir) * off, ly = y + Math.sin(dir) * off;
        const nameY = horiz ? ly + 5 : (up ? ly - 12 : ly + 16); const stateY = nameY + 16;
        const state = m.kind === 'agent' ? STATE_WORD[m.state] : (baton ? 'has the baton' : (m.me ? 'you' : 'here'));
        out.push(`<g class="lbl ${m.kind}" data-m="${m.id}" style="--d:${si * 120 + 260 + i * 40}ms"><text class="name" x="${f(lx)}" y="${f(nameY)}" text-anchor="${anchorT}">${esc(m.name)}</text><text class="state" x="${f(lx)}" y="${f(stateY)}" text-anchor="${anchorT}">${esc(state)}</text></g>`);
      });
      const sp = rings[s.id].pair; const sx = sp === 'L' ? cx - 6 : sp === 'R' ? cx + 6 : cx;
      out.push(`<text class="sname" x="${f(sx)}" y="${f(cy + r + (lay.phone ? 40 : 44))}" text-anchor="${sp === 'L' ? 'end' : sp === 'R' ? 'start' : 'middle'}">${esc(s.name)}</text>`);
      out.push('</g>');
    });
    // the crew stitch: a dotted bow under the sky between the crew-mates' agents, the crew's name along it
    const A = agentPos['cy-agent'], B = agentPos['dee-agent'];
    if (A && B) {
      const id = 'stitch-' + Math.random().toString(36).slice(2, 7);
      const mx = (A.x + B.x) / 2, my = Math.max(A.y, B.y) + (lay.phone ? 54 : 78);
      out.push(`<g class="threadg"><path id="${id}" class="thread" d="M${f(A.x)} ${f(A.y + 9)} Q${f(mx)} ${f(my)} ${f(B.x - 9)} ${f(B.y)}"/><text class="crew" dy="-7"><textPath href="#${id}" startOffset="50%" text-anchor="middle">Invoice rollout</textPath></text></g>`);
    }
    return out.join('');
  }

  /* ------------------------------------------------------------------------------------------
     A stage: beats are a number (data-frame); JS lays out the sky, sets the frame and runs the clock.
     ------------------------------------------------------------------------------------------ */
  function mount(stage, opts = {}) {
    const sky = stage.querySelector('.sky'), cam = sky.querySelector('.cam'), lamp = stage.querySelector('.lamp');
    const ticksEl = stage.querySelector('.ticks'), fill = stage.querySelector('.fill'), head = stage.querySelector('.head');
    const live = stage.querySelector('.live');
    let lay, frame = opts.frame || 1, playing = false, clock = 0, raf = 0, last = 0, calmTimer = 0;
    // the clock stretches with the text, never the other way (the product lead's fix): 2 s + words at 2.6 / s, never under the base
    const words = b => { const el = stage.querySelector(`.beat[data-b="${b}"]`); if (!el) return 0; const hid = [...el.querySelectorAll(stage.dataset.agent === 'fresh' ? '[data-read]' : '[data-fresh]')].map(h => h.textContent).join(' '); return el.textContent.split(/\s+/).filter(Boolean).length - hid.split(/\s+/).filter(Boolean).length; };
    const durs = () => BEATS.map((bt, i) => i === 5 ? bt.base : Math.max(bt.base, Math.round(1.2 + words(i + 1) / 3.6)));
    const fmt = s => `${Math.floor(s / 60)}:${String(Math.round(s % 60)).padStart(2, '0')}`;
    let D = durs(); let starts = D.map((_, i) => D.slice(0, i).reduce((a, b) => a + b, 0)); let total = starts[5] + D[5];
    stage.querySelector('.total').textContent = fmt(total);
    stage.querySelectorAll('.beat .tick-t').forEach((el, i) => el.textContent = fmt(starts[i + 1]));
    ticksEl.innerHTML = BEATS.map((bt, i) => `<button class="tick" type="button" data-f="${i + 1}" aria-label="Beat ${i + 1}, ${esc(bt.n)}, at ${fmt(starts[i])}"><span class="n">${esc(bt.n)}</span><span class="t">${fmt(starts[i])}</span></button>`).join('');

    function size() {
      const W = opts.W || stage.clientWidth || 1440, H = opts.H || stage.clientHeight || 900;
      lay = layout(W, H);
      sky.setAttribute('viewBox', `0 0 ${W} ${H}`);
      cam.innerHTML = renderSky(lay);
      apply(true);
    }
    function apply(fromSize) {
      stage.dataset.frame = String(frame);
      stage.style.setProperty('--cam', lay.cams[frame]);
      const L = lay.lamps[frame]; lamp.style.setProperty('--lx', f(L.x) + 'px'); lamp.style.setProperty('--ly', f(L.y) + 'px'); lamp.style.setProperty('--ls', L.s);
      ticksEl.querySelectorAll('.tick').forEach(t => { if (Number(t.dataset.f) === frame) t.setAttribute('aria-current', 'step'); else t.removeAttribute('aria-current'); });
      if (!playing) setProgress(starts[frame - 1] / total);
      if (live && !fromSize) live.textContent = BEATS[frame - 1].say;
    }
    function setProgress(p) { const v = f(Math.max(0, Math.min(1, p)) * 100) + '%'; fill.style.setProperty('--p', v); head.style.setProperty('--p', v); }
    // once-runs play only when a beat is entered with motion on and after boot (MOTION §4.4: first paint is never a swing)
    const hero = () => sky.querySelector('.ring.hero');
    function onceRuns(from, to) {
      if (!motionOn() || html.classList.contains('boot') || opts.parked) return;
      if (to === 2 && from < 2) { const h = hero(); h.classList.add('swing'); setTimeout(() => h.classList.remove('swing'), 1000); }
      if (to === 3 && from < 3) { sky.querySelectorAll('.ring:not(.hero)').forEach(g => { g.classList.add('landing'); setTimeout(() => g.classList.remove('landing'), 2200); }); }
      if (to === 6 && from < 6) {
        const m = stage.querySelector('.joinmark'), av = stage.querySelector('.joinav'), c = stage.querySelector('.joinline .count');
        setTimeout(() => { m.classList.add('settle'); av.classList.add('joined'); c.classList.add('popped'); }, 560);
        setTimeout(() => { m.classList.remove('settle'); av.classList.remove('joined'); c.classList.remove('popped'); }, 3200);
      }
    }
    function go(n, opt = {}) { n = Math.max(1, Math.min(6, n)); const from = frame; frame = n; apply(); onceRuns(from, n); if (opt.seek !== false) { clock = starts[n - 1]; if (!playing) setProgress(clock / total); } }
    function tick(now) {
      if (!playing) return;
      const dt = Math.min(.25, (now - last) / 1000); last = now; clock += dt * (opts.speed || 1);
      const fr = Math.min(6, starts.findIndex((s, i) => clock < s + D[i]) + 1 || 6);
      if (fr !== frame) go(fr, { seek: false });
      setProgress(clock / total);
      if (clock >= total) { playing = false; stage.dispatchEvent(new CustomEvent('brief:end')); return; }
      if (motionOn()) raf = requestAnimationFrame(tick); else calmTimer = setTimeout(() => tick(performance.now()), 500); // Calm: the clock steps, nothing glides
    }
    function play() { if (playing) return; playing = true; last = performance.now(); if (clock >= total) clock = 0; stage.dataset.playing = ''; tick(last); }
    function pause() { playing = false; cancelAnimationFrame(raf); clearTimeout(calmTimer); delete stage.dataset.playing; }
    ticksEl.addEventListener('click', e => { const t = e.target.closest('.tick'); if (t) { pause(); go(Number(t.dataset.f)); } });
    stage.querySelector('.skip').addEventListener('click', () => { pause(); go(6); });
    stage.querySelector('.enter').addEventListener('click', () => { pause(); go(6); });
    stage.querySelector('.alt a').addEventListener('click', e => e.preventDefault());
    size();
    if (!opts.W) addEventListener('resize', () => { size(); });
    return { go, play, pause, get frame() { return frame; }, get playing() { return playing; }, stage, relayout: size };
  }

  /* ------------------------------------------------------------------------------------------
     Boot: read the URL (#f=N, play=1, calm, agent=fresh, inspector, storyboard), mount, keys.
     ------------------------------------------------------------------------------------------ */
  const q = new URLSearchParams(location.hash.replace(/^#/, '').replace(/&amp;/g, '&'));
  if (q.has('calm')) html.dataset.motion = 'calm';
  if (q.has('inspector')) html.dataset.inspector = '';
  const tpl = document.getElementById('stage-tpl');
  const agentMode = q.get('agent') === 'fresh' ? 'fresh' : 'read';
  const makeStage = () => { const s = tpl.content.firstElementChild.cloneNode(true); if (agentMode === 'fresh') s.dataset.agent = 'fresh'; return s; };

  if (q.has('storyboard')) {
    document.body.classList.add('storyboard');
    const board = document.querySelector('.board');
    const k = Math.min(.3, (Math.min(innerWidth, 1440) - 48 - 48) / 3 / 1440);
    const starts = []; // filled from the first mounted stage's ticks
    BEATS.forEach((bt, i) => {
      const fig = document.createElement('figure');
      const wrap = document.createElement('div'); wrap.className = 'frame'; wrap.style.setProperty('--k', k);
      const s = makeStage(); s.setAttribute('inert', ''); s.setAttribute('aria-hidden', 'true'); wrap.appendChild(s);
      const cap = document.createElement('figcaption'); fig.appendChild(wrap); fig.appendChild(cap); board.appendChild(fig);
      const api = mount(s, { frame: i + 1, parked: true, W: 1440, H: 900 });
      const t = s.querySelector(`.tick[data-f="${i + 1}"] .t`).textContent;
      cap.innerHTML = `<span class="num">${i + 1}</span><span class="n">${esc(bt.n)}</span><span class="mono">${t}</span><span>${esc(bt.say.split('. ')[0])}.</span>`;
    });
  } else {
    const s = makeStage(); document.body.prepend(s);
    const api = mount(s, { frame: Number(q.get('f')) || 1, speed: Number(q.get('speed')) || 1 });
    // keys: 1–6 jump, ← → step, Space plays or pauses, Esc skips to the session; never while a field has focus
    addEventListener('keydown', e => {
      if (e.target.closest && e.target.closest('input, textarea, [contenteditable]')) return;
      if (/^[1-6]$/.test(e.key)) { api.pause(); api.go(Number(e.key)); }
      else if (e.key === 'ArrowRight') { api.pause(); api.go(api.frame + 1); }
      else if (e.key === 'ArrowLeft') { api.pause(); api.go(api.frame - 1); }
      else if (e.key === ' ') { e.preventDefault(); api.playing ? api.pause() : api.play(); syncInspector(); }
      else if (e.key === 'Escape') { api.pause(); api.go(6); }
    });
    // the inspector (exploration only)
    const insp = document.querySelector('.inspector');
    const segs = insp.querySelector('.beats'); segs.innerHTML = BEATS.map((b, i) => `<button type="button" data-f="${i + 1}">${i + 1}</button>`).join('');
    const syncInspector = () => { segs.querySelectorAll('button').forEach(b => { if (Number(b.dataset.f) === api.frame) b.setAttribute('aria-current', 'step'); else b.removeAttribute('aria-current'); }); insp.querySelector('.play').setAttribute('aria-pressed', String(api.playing)); insp.querySelector('.play').textContent = api.playing ? 'Pause' : 'Play'; };
    segs.addEventListener('click', e => { const b = e.target.closest('button'); if (b) { api.pause(); api.go(Number(b.dataset.f)); syncInspector(); } });
    insp.querySelector('.play').addEventListener('click', () => { api.playing ? api.pause() : api.play(); syncInspector(); });
    insp.querySelector('.calm').addEventListener('click', e => { const on = html.dataset.motion !== 'calm'; if (on) html.dataset.motion = 'calm'; else delete html.dataset.motion; e.currentTarget.setAttribute('aria-pressed', String(on)); });
    insp.querySelector('.dark').addEventListener('click', e => { const on = html.dataset.theme !== 'dark'; html.dataset.theme = on ? 'dark' : 'light'; e.currentTarget.setAttribute('aria-pressed', String(on)); });
    insp.querySelector('.agent').addEventListener('click', e => { const fresh = s.dataset.agent !== 'fresh'; if (fresh) s.dataset.agent = 'fresh'; else delete s.dataset.agent; e.currentTarget.setAttribute('aria-pressed', String(fresh)); e.currentTarget.textContent = fresh ? 'Agent: fresh' : 'Agent: read'; });
    insp.querySelector('.calm').setAttribute('aria-pressed', String(html.dataset.motion === 'calm'));
    insp.querySelector('.agent').setAttribute('aria-pressed', String(agentMode === 'fresh')); insp.querySelector('.agent').textContent = agentMode === 'fresh' ? 'Agent: fresh' : 'Agent: read';
    s.addEventListener('brief:end', syncInspector);
    const observer = new MutationObserver(syncInspector); observer.observe(s, { attributes: true, attributeFilter: ['data-frame', 'data-playing'] });
    syncInspector();
    if (q.get('play') === '1') requestAnimationFrame(() => requestAnimationFrame(() => { api.play(); syncInspector(); }));
  }
  // first paint lands finished; the clocks come back after two frames
  requestAnimationFrame(() => requestAnimationFrame(() => html.classList.remove('boot')));
})();
</script>
</body>
</html>
