<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-labelledby="t"><title id="t">Tiller mark</title>
  <!-- hull: a navy arc, the vessel the crew shares -->
  <path d="M8 36c6 12 16 18 24 18s18-6 24-18" fill="none" stroke="#2A3244" stroke-width="7" stroke-linecap="round"/>
  <!-- tiller: a chocolate bar from the stern post, angled as a hand would hold it -->
  <path d="M32 44V22" stroke="#56352D" stroke-width="7" stroke-linecap="round"/>
  <path d="M32 22l18-10" stroke="#56352D" stroke-width="7" stroke-linecap="round"/>
  <!-- grip: the apricot hand on the tiller -->
  <circle cx="50" cy="12" r="6.5" fill="#E2C4A6"/>
</svg>
