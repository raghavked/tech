<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" width="96" height="96" role="img" aria-labelledby="t"><title id="t">Fold mark</title>
  <!-- the sheet: Dress Blues -->
  <rect x="12" y="12" width="72" height="72" rx="14" fill="#2A3244"/>
  <!-- the underside revealed by the fold: Chocolate Fondant -->
  <path d="M84 12v34L50 12z" fill="#56352D"/>
