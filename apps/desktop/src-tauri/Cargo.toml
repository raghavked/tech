[package]
name = "fold-desktop"
version = "0.1.0"
description = "Fold desktop shell: the web client in a window, a tray that counts what awaits you, native notifications and fold:// deep links."
edition = "2021"
rust-version = "1.77"
publish = false

[[bin]]
name = "fold-desktop"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# 2.2 or later: WebviewWindow::set_badge_count (macOS, Linux) behind the pending-approvals badge.
tauri = { version = "2.5", features = ["tray-icon"] }
tauri-plugin-deep-link = "2"
tauri-plugin-notification = "2"
tauri-plugin-opener = "2"
tauri-plugin-single-instance = { version = "2", features = ["deep-link"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Polls GET /api/notifications on the Fold server; rustls so no OpenSSL is needed on Linux.
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
tokio = { version = "1", features = ["time"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
