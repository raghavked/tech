[project]
name = "basis-research"
version = "0.1.0"
description = "Research SDK over the Basis store: typed pandas access to observations, nowcasts, curves, spreads and the paper ledger"
requires-python = ">=3.11"
dependencies = ["pandas>=2.2", "numpy>=1.26"]

[project.optional-dependencies]
plots = ["matplotlib>=3.8"]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/basis_research"]

[tool.pytest.ini_options]
testpaths = ["tests"]
